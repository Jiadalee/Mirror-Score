[project]
name = "mirrorscore"
version = "0.1.0"
description = "Calibrated, inference-only scoring of D-peptide/L-protein binding in mirror space"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "biopython",
    "gemmi",
    "torch",
]

[project.optional-dependencies]
design = ["pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mirrorscore"]
